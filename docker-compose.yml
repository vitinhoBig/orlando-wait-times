services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: orlando
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: orlando_waits
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U orlando -d orlando_waits"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://orlando:${POSTGRES_PASSWORD}@db:5432/orlando_waits
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
